# One-click deploy: Render dashboard → New → Blueprint → select this repo.
services:
  - type: web
    name: stockbot
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: SEC_USER_AGENT
        sync: false          # e.g. "StockBot-Demo/2.0 you@yourdomain.com"
      - key: DEMO_ACCESS_CODE
        sync: false          # optional: leave empty for a fully public demo
      - key: GEMINI_DAILY_LIMIT
        value: "300"
      - key: AV_DAILY_LIMIT
        value: "25"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
